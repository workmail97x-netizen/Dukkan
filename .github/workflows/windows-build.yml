name: Build Dukkan for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, feature/library-batch-barcodes]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package*.json'
      - 'vite.config.mjs'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Build Tauri bundles
        run: npm run tauri build
      - name: Smoke test Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -File | Select-Object -First 1
          if (-not $installer) { throw 'The NSIS installer was not generated.' }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)." }
          $locations = @(
            (Join-Path $env:LOCALAPPDATA 'Programs'),
            (Join-Path $env:LOCALAPPDATA 'Dukkan'),
            $env:ProgramFiles
          )
          $app = $null
          foreach ($location in $locations) {
            if (Test-Path $location) {
              $app = Get-ChildItem -Path $location -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -ieq 'dukkan.exe' } | Select-Object -First 1
              if ($app) { break }
            }
          }
          if (-not $app) { throw 'The installed Dukkan executable was not found.' }
          $running = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($running.HasExited) { throw 'Dukkan exited during the installer smoke test.' }
          Stop-Process -Id $running.Id -Force
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Dukkan-Windows-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
